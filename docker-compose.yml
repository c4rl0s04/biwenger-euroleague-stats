services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: biwenger_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the local database initialization password}
      POSTGRES_DB: ${POSTGRES_DB:-biwenger}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    container_name: biwenger_web
    restart: always
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for the container network}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      BIWENGER_CREDENTIAL_KEYS: ${BIWENGER_CREDENTIAL_KEYS:-}
      BIWENGER_CREDENTIAL_ACTIVE_KEY_ID: ${BIWENGER_CREDENTIAL_ACTIVE_KEY_ID:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      - postgres

  sync:
    build: .
    container_name: biwenger_sync
    command: >
      sh -c '
        if ! node -e "const h = new URL(process.env.DATABASE_URL).hostname; process.exit([\"localhost\",\"127.0.0.1\",\"[::1]\",\"postgres\"].includes(h) ? 0 : 1)"; then
          echo "Remote database: automatic sync disabled. Run an explicit approved sync command.";
          tail -f /dev/null;
        else
          while true; do
            npm run sync || echo "Sync failed";
            sleep 21600;
          done;
        fi'
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for the container network}
      BIWENGER_TOKEN: ${BIWENGER_TOKEN:-}
      BIWENGER_API_VERSION_FALLBACK: ${BIWENGER_API_VERSION_FALLBACK:-}
      EUROLEAGUE_ADVANCED_API_URL: ${EUROLEAGUE_ADVANCED_API_URL:-}
      EUROLEAGUE_ADVANCED_API_TOKEN: ${EUROLEAGUE_ADVANCED_API_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      - postgres

volumes:
  postgres_data:
