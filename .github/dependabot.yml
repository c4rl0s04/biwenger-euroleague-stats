version: 2

updates:
  # npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 is not yet supported by the lint/build toolchain (see PR #138).
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    # Minor/patch updates arrive as one weekly PR per group; majors stay separate for review.
    groups:
      next-ecosystem:
        patterns:
          - 'next'
          - '@next/*'
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      development-dependencies:
        dependency-type: 'development'
        update-types: ['minor', 'patch']
        # Playwright also needs the image pin in scripts/e2e/Dockerfile.
        exclude-patterns: ['playwright']
      production-dependencies:
        dependency-type: 'production'
        update-types: ['minor', 'patch']

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
