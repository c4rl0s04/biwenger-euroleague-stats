name: Manager cash report

on:
  workflow_dispatch:
    inputs:
      manager:
        description: Manager name or ID (leave empty for everyone)
        type: string
        required: false
      all_details:
        description: Include squads, transfers, and bonuses for every manager
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  report:
    name: Calculate manager cash
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate report
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=60000
          MANAGER: ${{ inputs.manager }}
          ALL_DETAILS: ${{ inputs.all_details }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$POSTGRES_HOST" || -z "$POSTGRES_USER" || -z "$POSTGRES_PASSWORD" || -z "$POSTGRES_DB" ]]; then
            echo 'Missing database secrets. Configure the POSTGRES_* secrets used by Scheduled Sync.' >&2
            exit 1
          fi
          mkdir -p reports
          args=(--no-color --json-file=reports/manager-cash.json)
          if [[ -n "$MANAGER" ]]; then
            args+=("--manager=$MANAGER")
          elif [[ "$ALL_DETAILS" == 'true' ]]; then
            args+=(--all-details)
          fi
          npm run --silent ledger -- "${args[@]}" > reports/manager-cash.txt
      - name: Publish run summary
        run: |
          python3 scripts/finance/manager_cash_summary.py reports/manager-cash.json "$GITHUB_STEP_SUMMARY"
      - name: Upload full report
        uses: actions/upload-artifact@v4
        with:
          name: manager-cash-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/manager-cash.txt
          if-no-files-found: error
          retention-days: 7
