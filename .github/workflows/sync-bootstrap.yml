name: Bootstrap Sync

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap active season
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate providers and bootstrap active season
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          BIWENGER_TOKEN: ${{ secrets.BIWENGER_TOKEN }}
          BIWENGER_API_VERSION_FALLBACK: ${{ vars.BIWENGER_API_VERSION_FALLBACK }}
        run: npm run sync:preflight && npm run sync:bootstrap
