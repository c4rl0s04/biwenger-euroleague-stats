name: Live Fantasy Sync

on:
  schedule:
    # Run every 5 minutes during Euroleague Game Windows
    # Times are in UTC. Euroleague usually plays 18:00-23:00 CET (17:00-22:00 UTC)
    # Days: Tuesday (2) to Friday (5)
    - cron: '*/5 16-22 * * 2-5'

  workflow_dispatch: # Allows manual trigger from GitHub UI

concurrency:
  group: live-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-sync:
    name: 🏀 Live Euroleague Sync
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Good practice to prevent stuck jobs

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Live Sync
        run: npm run sync:preflight -- --skip-provider-probes && npm run sync:live
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Database Connection (Individual components, matching local setup)

          # Biwenger credentials
          BIWENGER_TOKEN: ${{ secrets.BIWENGER_TOKEN }}
          BIWENGER_API_VERSION_FALLBACK: ${{ vars.BIWENGER_API_VERSION_FALLBACK }}

          # Canonical season configuration

          # Observability
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

          # Node runtime conditions
          NODE_OPTIONS: --conditions=react-server
