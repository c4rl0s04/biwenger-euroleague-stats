name: Scheduled Sync

on:
  schedule:
    # Run every 6 hours (at minute 0 past hour 0, 6, 12, and 18)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

concurrency:
  group: scheduled-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Run Biwenger Sync
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate season and run sync
        env:
          # Database Connection
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          # Biwenger Credentials
          BIWENGER_TOKEN: ${{ secrets.BIWENGER_TOKEN }}
          BIWENGER_API_VERSION_FALLBACK: ${{ vars.BIWENGER_API_VERSION_FALLBACK }}

          # Canonical season configuration

          # Observability
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

          # Node runtime conditions
          NODE_OPTIONS: --conditions=react-server
        run: npm run sync:preflight && npm run sync
