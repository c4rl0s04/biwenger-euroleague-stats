name: Scheduled Sync

on:
  schedule:
    # Run every 6 hours (at minute 0 past hour 0, 6, 12, and 18)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

concurrency:
  group: scheduled-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Run Biwenger Sync
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate season and run sync
        env:
          # Database Connection
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}

          # Biwenger Credentials
          BIWENGER_TOKEN: ${{ secrets.BIWENGER_TOKEN }}
          BIWENGER_LEAGUE_ID: ${{ secrets.BIWENGER_LEAGUE_ID }}
          BIWENGER_USER_ID: ${{ secrets.BIWENGER_USER_ID }}
          BIWENGER_API_VERSION_FALLBACK: ${{ vars.BIWENGER_API_VERSION_FALLBACK }}

          # Canonical season configuration
          SEASON_ID: ${{ vars.SEASON_ID }}
          SEASON_NAME: ${{ vars.SEASON_NAME }}
          EUROLEAGUE_SEASON_CODE: ${{ vars.EUROLEAGUE_SEASON_CODE }}
          LEAGUE_START_DATE: ${{ vars.LEAGUE_START_DATE }}
          SEASON_AWARE_READS_CONFIRMED: ${{ vars.SEASON_AWARE_READS_CONFIRMED }}
        run: npm run sync:preflight && npm run sync
